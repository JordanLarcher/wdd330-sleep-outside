<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="/css/style.css" />
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider">
    <section class="checkout">
      <h2>Review & Place your Order</h2>

      <section class="order-summary">
        <h3>Order Summary</h3>

        <p>Items: <span id="item-count">0 items</span></p>
        <p>Subtotal: <span id="subtotal">$0.00</span></p>
        <p>Tax: <span id="tax">$0.00</span></p>
        <p>Shipping: <span id="shipping">$0.00</span></p>

        <h3>Order Total: <span id="order-total">$0.00</span></h3>
      </section>
      <form id="checkout-form">
        <h3>Customer Information</h3>

        <label for="fname">First Name</label>
        <input type="text" id="fname" name="fname" required />

        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lname" required />

        <h3>Address</h3>

        <label for="street">Street Address</label>
        <input type="text" id="street" name="street" required />

        <label for="city">City</label>
        <input type="text" id="city" name="city" required />

        <label for="state">State</label>
        <input type="text" id="state" name="state" required />

        <label for="zip">Zip Code</label>
        <input type="text" id="zip" name="zip" required />

        <h3>Payment Information</h3>

        <label for="cardNumber">Credit Card Number</label>
        <input type="text" id="cardNumber" name="cardNumber" inputmode="numeric" required />

        <label for="expiration">Expiration Date</label>
        <input type="text" id="expiration" name="expiration" placeholder="MM/YY" pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
          required />

        <label for="code">Security Code</label>
        <input type="text" id="code" name="code" inputmode="numeric" required />

        <button type="submit">Checkout</button>
      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
