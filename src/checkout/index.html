<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">

      <form>
        <legend>1. Customer Name</legend>
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first-name" required />
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name" required />

        <legend>2. Shipping Address</legend>
        <label for="address">Street Address</label>
        <input type="text" id="address" name="address" required />
        <label for="city">City</label>
        <input type="text" id="city" name="city" required />
        <label for="state">State</label>
        <input type="text" id="state" name="state" required />
        <label for="zip">Zip Code</label>
        <input type="number" id="zip" name="zip" required />

        <legend>3. Payment Information</legend>
        <label for="card-name">Name on Card</label>
        <input type="text" id="card-name" name="card-name" required />
        <label for="card-number">Credit Card Number</label>
        <input type="text" id="card-number" name="card-number" required />
        <label for="expiry">Expiration Date</label>
        <input type="text" id="expiry" name="expiry" required />
        <label for="cvv">CVV</label>
        <input type="number" id="cvv" name="cvv" required />
      </form>
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
