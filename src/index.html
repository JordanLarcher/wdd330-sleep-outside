<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Home</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="js/main.js" type="module"></script>
  
</head>

<body>
  <header class="divider" id="main-header"></header>
  <main class="divider">
    <div class="hero">
      <img src="/images/banner-sm.jpg" srcset="images/banner-sm.jpg 500w, images/banner.jpg"
        alt="image of a high mountain lake" />
      <div class="logo logo--square">
        <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
        <div>Sleep<span class="highlight">Outside</span></div>
      </div>
      <div class="mission">
        <p>
          Our mission is to provide you with everything you need to sleep
          outside comfortably at an affordable price.
        </p>
      </div>
    </div>

      <section class="products">
        <h2>Top Products</h2>
        <div class="sort-controls">
          <label for="sort">Sort by:</label>
          <select id="sort">
            <option value="name-asc">Name: A to Z</option>
            <option value="name-desc">Name: Z to A</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
          </select>
        </div>
        <ul class="product-list">
          <li class="product-card">
            <a href="product_pages/index.html?product=880RR">
              <img
                src="images/tents/marmot-ajax-tent-3-person-3-season-in-pale-pumpkin-terracotta~p~880rr_01~320.jpg"
                alt="Marmot Ajax tent"
              />
              <h3 class="card__brand">Marmot</h3>
              <h2 class="card__name">Ajax Tent - 3-Person, 3-Season</h2>
              <p class="product-card__price">$199.99</p>
        <label for="product-sort">Sort products by:</label>

        <ul class="product-grid">
          <li>
            <a href="product_listing/index.html?category=tents">
              <img src="images/category-tents.svg" alt="Tents" />
              <h2>Tents</h2>
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=backpacks">
              <img src="images/category-backpacks.svg" alt="Backpacks" />
              <h2>Backpacks</h2>
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=sleeping-bags">
              <img src="images/category-sleepingbags.svg" alt="Sleeping Bags" />
              <h2>Sleeping Bags</h2>
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=hammocks">
              <img src="images/category-hammocks.svg" alt="Hammocks" />
              <h2>Hammocks</h2>
            </a>
          </li>
        </ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
